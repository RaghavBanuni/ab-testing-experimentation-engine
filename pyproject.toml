[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-engine"
version = "1.0.0"
description = "Experimentation engine with always-valid sequential inference, CUPED and invalidation gates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raghav Banuni" }]
keywords = ["ab-testing", "experimentation", "sequential-testing", "msprt", "cuped", "causal-inference"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ab-engine = "ab_engine.cli:main"

[tool.setuptools]
packages = ["ab_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
